<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nakd. 4x6 Label</title>
<style>
  /* 4x6 thermal label, portrait. Click any text to edit, then Print (Ctrl/Cmd+P). */
  @page { size: 4in 6in; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e5e5e5; font-family: Helvetica, Arial, sans-serif; color: #000; }

  .hint {
    max-width: 4in; margin: 16px auto 8px; font-size: 12px; color: #444; text-align: center;
  }

  .label {
    width: 4in; height: 6in; margin: 0 auto 24px; background: #fff;
    padding: 0.25in; display: flex; flex-direction: column;
  }

  .brand { font-size: 28pt; font-weight: 800; letter-spacing: -0.5pt; line-height: 1; }

  .from { margin-top: 0.2in; font-size: 9pt; line-height: 1.35; }
  .tag  { font-size: 7pt; font-weight: 700; letter-spacing: 1pt; text-transform: uppercase; margin-bottom: 3pt; }

  .rule { border-top: 2pt solid #000; margin: 0.25in 0; }

  .to { flex: 1; }
  .to .addr { font-size: 16pt; font-weight: 700; line-height: 1.3; }

  .foot { border-top: 1pt solid #000; padding-top: 6pt; font-size: 8pt; display: flex; justify-content: space-between; }

  [contenteditable]:hover { outline: 1px dashed #999; }
  [contenteditable]:focus { outline: 1px solid #000; }

  @media print {
    html, body { background: #fff; }
    .hint { display: none; }
    .label { margin: 0; page-break-after: always; }
    [contenteditable]:hover, [contenteditable]:focus { outline: none; }
  }
</style>
</head>
<body>
  <p class="hint">Click any text to edit. Print at 100% / “Actual size” on 4×6 labels.</p>

  <div class="label">
    <div class="brand">nakd.</div>

    <div class="from">
      <div class="tag">From</div>
      <div contenteditable="true">
        8&amp;9<br>
        123 Street Address<br>
        City, ST 00000
      </div>
    </div>

    <div class="rule"></div>

    <div class="to">
      <div class="tag">Ship To</div>
      <div class="addr" contenteditable="true">
        Recipient Name<br>
        Street Address<br>
        Apt / Suite<br>
        City, ST 00000
      </div>
    </div>

    <div class="foot">
      <span contenteditable="true">Order #</span>
      <span>nakdpeptides.com</span>
    </div>
  </div>
</body>
</html>
